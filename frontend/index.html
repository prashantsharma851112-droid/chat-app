<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatSpace — Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">
      <div class="auth-brand-top">
        <div class="brand-mark">ChatSpace — 001</div>
        <h2>Real conversations.<br>Real time.</h2>
      </div>
      <div class="auth-brand-bottom">
        <span class="quote-mark">"</span>
        <p>1-on-1 chats and group rooms, delivered instantly with Socket.io — no refresh needed.</p>
      </div>
    </div>

    <div class="auth-panel">
      <div class="auth-container">
        <h1>💬 ChatSpace</h1>

        <div class="auth-tabs">
          <button id="tab-login" class="auth-tab active">Login</button>
          <button id="tab-register" class="auth-tab">Register</button>
        </div>

        <p id="auth-error" class="auth-error"></p>

        <form id="login-form" class="auth-form">
          <input type="email" id="login-email" placeholder="Email" required>
          <input type="password" id="login-password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <input type="text" id="register-name" placeholder="Full Name" required>
          <input type="text" id="register-username" placeholder="Username (unique, e.g. prashant_07)" required pattern="[a-zA-Z0-9_]{3,20}">
          <input type="email" id="register-email" placeholder="Email" required>
          <input type="password" id="register-password" placeholder="Password (min 6 characters)" required minlength="6">
          <button type="submit">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
